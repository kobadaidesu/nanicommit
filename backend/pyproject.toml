[project]
name = "nanicommit-backend"
version = "0.1.0"
description = "nanicommit FastAPI backend: auth, repository registration, commit intake, quiz generation (MCP), quizzes, push check"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "supabase>=2.7",
    "mcp>=2.2.0",
    "google-genai>=2.25.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
